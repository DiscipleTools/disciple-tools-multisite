name: Release

on:
  push:
    tags:
    - '*.*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
    # Docs: https://getcomposer.org/doc/articles/scripts.md

    # - name: Run test suite
    #   run: composer run-script test

    # Build the plugin zip and publish it as the asset of a GitHub release for the pushed tag
    - name: Build project
      run: |
        mkdir disciple-tools-multisite
        cp -r disciple-tools-multisite.php LICENSE SECURITY.md includes languages spinner.svg version-control.json disciple-tools-multisite/
        zip -r disciple-tools-multisite.zip disciple-tools-multisite
    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "$GITHUB_REF_NAME" disciple-tools-multisite.zip --title "Release v$GITHUB_REF_NAME" --notes ""
